name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 1" # weekly, Monday 00:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check .

  # Full Home Assistant harness (pytest-homeassistant), twice. Versions come
  # from the repository metadata (scripts/test_requirements.py), never repeated:
  # - minimum: Core at the hacs.json floor, manifest.json requirements at their
  #   minimum (pydaikin>=X installed as pydaikin==X)
  # - latest: newest harness + Core + pydaikin (catches upstream breakage early;
  #   the weekly schedule above re-runs it even without pushes)
  test:
    name: test (${{ matrix.versions }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions: [minimum, latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python scripts/test_requirements.py ${{ matrix.versions }} > "$RUNNER_TEMP/requirements_versions.txt"
          cat "$RUNNER_TEMP/requirements_versions.txt"
          .venv/bin/python -m pip install -U -r requirements_test.txt -r "$RUNNER_TEMP/requirements_versions.txt"
          .venv/bin/python -m pip show homeassistant pytest-homeassistant pydaikin | grep -E "^(Name|Version)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run pytest
        run: python -m pytest -q

  # Same tests as developers on Windows: only voluptuous + pytest (no Home Assistant wheel).
  test-local-minimal:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install local test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_local_tests.txt pytest

      - name: Run tests that do not require Home Assistant
        run: pytest -m "not requires_ha" -q
