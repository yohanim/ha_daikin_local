[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported
# (pytest-homeassistant still uses respx directly; only its plugin is off).
addopts = "-p no:respx"
filterwarnings = [
    "ignore:.*asyncio.*:DeprecationWarning",
    # Home Assistant's own http server class (aiohttp deprecation), not our code.
    "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning",
]
markers = [
    "local: no Home Assistant (run on Windows with requirements_local_tests.txt)",
    "requires_ha: needs homeassistant + pytest-homeassistant",
]

[tool.ruff]
target-version = "py314"
src = ["custom_components", "tests"]

[tool.ruff.lint.isort]
# The integration is first-party: its imports come after homeassistant's, which
# must be imported first (it installs its httpx and voluptuous replacements).
known-first-party = ["custom_components"]
