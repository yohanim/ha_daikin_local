name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 1" # weekly, Monday 00:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check .

  # Full Home Assistant harness, twice:
  # - pinned: Core at the hacs.json floor (compatibility code paths)
  # - latest: newest harness + Core + pydaikin (catches upstream breakage early;
  #   the weekly schedule above re-runs it even without pushes)
  test:
    name: test (${{ matrix.harness }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: pinned
            requirements: requirements_test.txt
          - harness: latest
            requirements: requirements_test_latest.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -U -r ${{ matrix.requirements }}
          .venv/bin/python -m pip show homeassistant pytest-homeassistant-custom-component pydaikin | grep -E "^(Name|Version)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run pytest
        run: python -m pytest -q

  # Same tests as developers on Windows: only voluptuous + pytest (no Home Assistant wheel).
  test-local-minimal:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install local test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_local_tests.txt pytest

      - name: Run tests that do not require Home Assistant
        run: pytest -m "not requires_ha" -q
