sync_history:
  name: Sync energy history
  description: Corrects energy statistics using historical data from the Daikin unit (Today and Yesterday).
  fields:
    days_ago:
      name: Days ago
      description: Number of days back to sync (0 for Today, 1 for Yesterday).
      example: 0
      default: 0
      required: false
      selector:
        number:
          min: 0
          max: 1
          mode: box
    entity_id:
      name: Target sensor (optional)
      description: If set, only the config entry that owns this entity runs the service (must belong to this integration).
      required: false
      selector:
        entity:
          filter:
            domain: sensor
    insert_missing:
      name: Insert missing hourly rows
      description: "If false (default), only hours that already have long-term statistics are updated — avoids UNIQUE constraint errors with the recorder. Set true to backfill gaps (use sparingly)."
      required: false
      default: false
      selector:
        boolean:
    history_skip_extra_hours:
      name: Additional hours to skip
      description: "Optional override for this run only (integration options apply if omitted). Hours to ignore in addition to the current hour; total skip = 1 + this value. When set together with history_hours_to_correct (or alone), the window is not clamped to a minimum."
      required: false
      selector:
        number:
          mode: box
    history_hours_to_correct:
      name: Hours to correct
      description: "Optional override for this run only. Number of completed local hourly slots to correct before the skipped range. When set together with history_skip_extra_hours (or alone), values are not clamped."
      required: false
      selector:
        number:
          mode: box

sync_total_history:
  name: Sync total energy history
  description: Corrects the smoothed total/compressor energy history from the Daikin unit (targeted fix, use rarely).
  fields:
    days_ago:
      name: Days ago
      description: Number of days back to sync (0 for Today, 1 for Yesterday).
      example: 0
      default: 0
      required: false
      selector:
        number:
          min: 0
          max: 1
          mode: box
    entity_id:
      name: Target total entity
      description: Optional sensor entity_id to target a single total/compressor sensor.
      required: false
      selector:
        entity:
          filter:
            domain: sensor
    insert_missing:
      name: Insert missing hourly rows
      description: "Same as sync_history: default false updates only existing LTS hours; true inserts missing hours (may conflict with recorder compilation)."
      required: false
      default: false
      selector:
        boolean:
    history_skip_extra_hours:
      name: Additional hours to skip
      description: "Same as sync_history: optional override for this run; total skip = 1 + this value (current hour always counted). Unclamped when this or history_hours_to_correct is set."
      required: false
      selector:
        number:
          mode: box
    history_hours_to_correct:
      name: Hours to correct
      description: "Same as sync_history: optional override for how many completed hourly slots to correct. Unclamped when this or history_skip_extra_hours is set."
      required: false
      selector:
        number:
          mode: box

set_demand_control:
  name: Set demand control
  description: Enable/disable demand control and set the max power limit on Daikin BRP069 units that support it (protocol v3+).
  fields:
    entity_id:
      name: Target entity (optional)
      description: If set, only the config entry that owns this entity runs the service.
      required: false
      selector:
        entity:
          filter:
            integration: daikin_local
    en_demand:
      name: Enable demand control
      description: Turn demand control on or off. Turning it off also resets mode to manual and max power to 100%.
      required: false
      selector:
        boolean:
    max_pow:
      name: Max power (%)
      description: Maximum power as a percentage of the unit's nominal power (0-100). Only used in manual mode.
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: box
    mode:
      name: Mode
      description: "Demand control mode: 0 = manual (fixed max power), 1 = scheduled, 2 = auto (unit manages the limit itself)."
      required: false
      selector:
        number:
          min: 0
          max: 2
          mode: box

set_brp084_options:
  name: Set BRP084 options
  description: Set the vertical vane position and/or dry-mode comfort offset on Daikin BRP084 (firmware 2.8.0) units.
  fields:
    entity_id:
      name: Target entity (optional)
      description: If set, only the config entry that owns this entity runs the service.
      required: false
      selector:
        entity:
          filter:
            integration: daikin_local
    vertical_vane:
      name: Vertical vane position
      description: "Discrete vertical vane position: off (neutral), down (floor), or swing (oscillate)."
      required: false
      selector:
        select:
          options:
            - "off"
            - "down"
            - "swing"
    dry_comfort_offset:
      name: Dry comfort offset (°C)
      description: Dry-mode comfort offset in degrees Celsius (-3.0 to 0.0, 0.5 steps).
      required: false
      selector:
        number:
          min: -3.0
          max: 0.0
          step: 0.5
          mode: box
